[project]
name = "optivox-backend"
version = "4.0.0"
description = "OptiVox DB — Agentic AI SQL Studio powered by LangGraph + LiteLLM + LanceDB"
requires-python = ">=3.11"

dependencies = [
    # Web
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-dotenv>=1.0.1",
    # Required for FastAPI Form(...) and File(...) multipart uploads
    "python-multipart>=0.0.9",
    "aiofiles>=23.0.0",
    # Pydantic
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    # LangGraph + LangChain (replaces CrewAI)
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "langchain-google-genai>=2.0.0",
    # LiteLLM (for simple non-agent LLM calls)
    "litellm>=1.40.0",
    # Database
    "sqlalchemy>=2.0.30",
    "pymysql>=1.1.1",
    "psycopg2-binary>=2.9.9",
    "oracledb>=2.3.0",
    # SQL parsing / validation
    "sqlglot>=25.0.0",
    # RAG
    "lancedb>=0.11.0",
    "sentence-transformers>=3.0.0",
    "pandas>=2.2.0",
    # Utilities
    "cachetools>=5.3.3",
    "pyarrow>=24.0.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv]
dev-dependencies = [
    "pytest>=8.2.0",
]
